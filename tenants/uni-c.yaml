# University C: fictional high-volume private university.
# Large intake with rolling admissions: lower minimums, no entry test,
# lenient image thresholds, and more automation.
tenant_id: uni-c
display_name: University C
profile: High-volume private university with rolling admissions
admission_cycle: "2026"
auth:
  api_key_secret: uni-c-api-key

documents:
  - type: cnic
    alternatives: [b_form]
    fields:
      - {name: cnic_number, pattern: '^\d{5}-\d{7}-\d$', pii: true, labels: [CNIC No., Identity Number, شناختی کارڈ نمبر, شناختی نمبر]}
      - {name: full_name, pii: true, labels: [Name, نام]}
      - {name: father_name, pii: true, labels: [Father Name, والد کا نام]}
      - {name: date_of_birth, type: date, pii: true, labels: [Date of Birth, تاریخ پیدائش]}
  - type: b_form
    required: false
    fields:
      - {name: b_form_number, pattern: '^\d{5}-\d{7}-\d$', pii: true, labels: [Registration No., B-Form No., رجسٹریشن نمبر]}
      - {name: full_name, pii: true, labels: [Name, نام]}
      - {name: father_name, pii: true, labels: [Father Name, والد کا نام]}
      - {name: date_of_birth, type: date, pii: true, labels: [Date of Birth, تاریخ پیدائش]}
  - type: matric_result
    fields: &result_fields
      - {name: full_name, pii: true, labels: [Name, Candidate Name, نام]}
      - {name: father_name, pii: true, labels: [Father Name, والد کا نام]}
      - {name: roll_number, pii: true, labels: [Roll No., رول نمبر]}
      - {name: board, labels: [Board, بورڈ]}
      - {name: passing_year, type: integer, labels: [Year, Session, سیشن]}
      - {name: obtained_marks, type: integer, labels: [Marks Obtained, Total Obtained, حاصل کردہ نمبر]}
      - {name: total_marks, type: integer, labels: [Total Marks, کل نمبر]}
  - type: fsc_result
    fields: *result_fields
  - type: fee_challan
    fields:
      - {name: challan_number, labels: [Challan No., چالان نمبر]}
      - {name: amount, type: integer, labels: [Amount, Rs., Amount (Rs.), رقم (روپے)]}
      - {name: paid_date, type: date, labels: [Date of Payment, Paid On, تاریخ ادائیگی]}

rules:
  - id: matric-min-45
    description: Matric marks at least 45%
    document: matric_result
    type: min_percentage
    obtained_field: obtained_marks
    total_field: total_marks
    min_percent: 45
  - id: fsc-min-45
    description: FSc marks at least 45%
    document: fsc_result
    type: min_percentage
    obtained_field: obtained_marks
    total_field: total_marks
    min_percent: 45
  - id: minimum-age
    description: Applicant at least 16 years old on 1 September
    document: cnic
    type: age
    field: date_of_birth
    reference_date: 2026-09-01
    min_years: 16
  - id: fee-amount
    description: Admission processing fee of Rs. 2500 paid
    document: fee_challan
    type: range
    field: amount
    min: 2500

cross_checks:
  - {field: full_name, documents: [cnic, matric_result, fsc_result], method: fuzzy, min_similarity: 0.85}

quality:
  min_width: 700
  min_height: 500
  min_blur_score: 45
  max_skew_degrees: 8
  min_contrast: 35

decision:
  classification_min_confidence: 0.65
  auto_approve_min_confidence: 0.85
  few_shot_examples: 3

notifications:
  default_language: en
  channel: log
  portal_url: https://apply.university-c.example
  templates:
    received:
      en: "{university}: got your {document_type} for application {application_id}."
      ur: "{university}: درخواست {application_id} کا {document_type} مل گیا ہے۔"
    reupload_required:
      en: "{university}: we could not read your {document_type} ({reasons}). Re-upload at {portal_url}."
      ur: "{university}: آپ کا {document_type} پڑھا نہیں جا سکا ({reasons})۔ {portal_url} پر دوبارہ اپ لوڈ کریں۔"
    needs_review:
      en: "{university}: application {application_id} needs a quick manual check."
      ur: "{university}: درخواست {application_id} کی مختصر دستی جانچ ہو رہی ہے۔"
    approved:
      en: "{university}: application {application_id} documents verified. Welcome!"
      ur: "{university}: درخواست {application_id} کے کاغذات کی تصدیق ہو گئی۔ خوش آمدید!"
    rejected:
      en: "{university}: application {application_id} could not be accepted ({reasons})."
      ur: "{university}: درخواست {application_id} قبول نہیں کی جا سکی ({reasons})۔"

retention_days: 180
