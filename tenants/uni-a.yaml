# University A: fictional selective private university.
# Small intake, strict thresholds, own entry test, no domicile requirement.
tenant_id: uni-a
display_name: University A
profile: Selective private university with its own admission test
admission_cycle: "2026"
auth:
  api_key_secret: uni-a-api-key

documents:
  - type: cnic
    alternatives: [b_form]
    fields:
      - {name: cnic_number, pattern: '^\d{5}-\d{7}-\d$', pii: true, labels: [CNIC No., Identity Number, شناختی کارڈ نمبر, شناختی نمبر]}
      - {name: full_name, pii: true, labels: [Name, نام]}
      - {name: father_name, pii: true, labels: [Father Name, والد کا نام]}
      - {name: date_of_birth, type: date, pii: true, labels: [Date of Birth, تاریخ پیدائش]}
  - type: b_form
    required: false
    fields:
      - {name: b_form_number, pattern: '^\d{5}-\d{7}-\d$', pii: true, labels: [Registration No., B-Form No., رجسٹریشن نمبر]}
      - {name: full_name, pii: true, labels: [Name, نام]}
      - {name: father_name, pii: true, labels: [Father Name, والد کا نام]}
      - {name: date_of_birth, type: date, pii: true, labels: [Date of Birth, تاریخ پیدائش]}
  - type: matric_result
    fields: &result_fields
      - {name: full_name, pii: true, labels: [Name, Candidate Name, نام]}
      - {name: father_name, pii: true, labels: [Father Name, والد کا نام]}
      - {name: roll_number, pii: true, labels: [Roll No., رول نمبر]}
      - {name: board, labels: [Board, بورڈ]}
      - {name: passing_year, type: integer, labels: [Year, Session, سیشن]}
      - {name: obtained_marks, type: integer, labels: [Marks Obtained, Total Obtained, حاصل کردہ نمبر]}
      - {name: total_marks, type: integer, labels: [Total Marks, کل نمبر]}
  - type: fsc_result
    fields: *result_fields
  - type: entry_test
    fields:
      - {name: full_name, pii: true, labels: [Candidate Name, Name, نام]}
      - {name: cnic_number, pattern: '^\d{5}-\d{7}-\d$', pii: true, labels: [CNIC, Identity Number, شناختی نمبر]}
      - {name: test_name, labels: [Test, ٹیسٹ]}
      - {name: score, type: number, labels: [Score, اسکور]}
      - {name: total_score, type: number, labels: [Out of, Maximum, کل اسکور]}
      - {name: test_date, type: date, labels: [Test Date, ٹیسٹ کی تاریخ]}
  - type: fee_challan
    fields:
      - {name: challan_number, labels: [Challan No., چالان نمبر]}
      - {name: amount, type: integer, labels: [Amount, Rs., Amount (Rs.), رقم (روپے)]}
      - {name: paid_date, type: date, labels: [Date of Payment, Paid On, تاریخ ادائیگی]}

rules:
  - id: matric-min-70
    description: Matric marks at least 70%
    document: matric_result
    type: min_percentage
    obtained_field: obtained_marks
    total_field: total_marks
    min_percent: 70
    severity: reject
  - id: fsc-min-70
    description: FSc (or Part-I) marks at least 70%
    document: fsc_result
    type: min_percentage
    obtained_field: obtained_marks
    total_field: total_marks
    min_percent: 70
    severity: reject
  - id: entry-test-min-60
    description: Admission test score at least 60 out of 100
    document: entry_test
    type: range
    field: score
    min: 60
    severity: reject
  - id: age-limit
    description: Applicant at most 24 years old on 1 September
    document: cnic
    type: age
    field: date_of_birth
    reference_date: 2026-09-01
    max_years: 24
  - id: fee-paid-in-window
    description: Application fee paid during the admission window
    document: fee_challan
    type: date_window
    field: paid_date
    not_before: 2026-06-01
    not_after: 2026-08-15
  - id: fee-amount
    description: Application fee of Rs. 5000 paid
    document: fee_challan
    type: range
    field: amount
    min: 5000

cross_checks:
  - {field: full_name, documents: [cnic, matric_result, fsc_result, entry_test], method: fuzzy, min_similarity: 0.9}
  - {field: father_name, documents: [cnic, matric_result, fsc_result], method: fuzzy, min_similarity: 0.9}
  - {field: cnic_number, documents: [cnic, entry_test], method: exact}

quality:
  min_width: 1000
  min_height: 700
  min_blur_score: 70
  min_contrast: 45
  max_skew_degrees: 4

decision:
  classification_min_confidence: 0.8
  auto_approve_min_confidence: 0.95
  few_shot_examples: 5

notifications:
  default_language: en
  channel: email
  portal_url: https://admissions.university-a.example
  templates:
    received:
      en: "{university}: we received your {document_type} for application {application_id}."
      ur: "{university}: درخواست {application_id} کے لیے آپ کا {document_type} موصول ہو گیا ہے۔"
    reupload_required:
      en: "{university}: your {document_type} could not be read ({reasons}). Please upload a clearer copy at {portal_url}."
      ur: "{university}: آپ کا {document_type} پڑھا نہیں جا سکا ({reasons})۔ براہ کرم {portal_url} پر واضح کاپی اپ لوڈ کریں۔"
    needs_review:
      en: "{university}: application {application_id} is being reviewed by our admissions team."
      ur: "{university}: درخواست {application_id} کا جائزہ داخلہ ٹیم لے رہی ہے۔"
    approved:
      en: "{university}: documents for application {application_id} are verified."
      ur: "{university}: درخواست {application_id} کے کاغذات کی تصدیق ہو گئی ہے۔"
    rejected:
      en: "{university}: application {application_id} does not meet the requirements ({reasons})."
      ur: "{university}: درخواست {application_id} مطلوبہ شرائط پر پوری نہیں اترتی ({reasons})۔"

retention_days: 365
