# OpenFaaS stack definition. See docs/adr/0004-function-packaging.md for how
# the shared library and tenant configs reach each function image.
version: 1.0
provider:
  name: openfaas
  gateway: ${OPENFAAS_URL:-http://127.0.0.1:8080}

configuration:
  templates:
    - name: python3-http
      source: https://github.com/openfaas/python-flask-template
  # Copied into every function's build context next to handler.py.
  copy:
    - ./libs
    - ./tenants

functions:
  intake:
    lang: python3-http
    handler: ./functions/intake
    image: ${REGISTRY:-localhost:5000}/admission-intake:${TAG:-latest}
    environment: &env
      PYTHONPATH: /home/app/function/libs
      AP_TENANTS_DIR: /home/app/function/tenants
      AP_GATEWAY_URL: http://gateway.openfaas:8080
      AP_S3_ENDPOINT: http://seaweedfs-s3.admission:8333
      max_inflight: "50"
      write_timeout: 30s
      read_timeout: 30s
      exec_timeout: 30s
    secrets: &auth_secrets
      - database-url
      - s3-access-key
      - s3-secret-key
      - uni-a-api-key
      - uni-b-api-key
      - uni-c-api-key
    labels:
      com.openfaas.scale.min: "1"
      com.openfaas.scale.max: "20"
    annotations:
      topic: admission-intake

  quality-check:
    lang: python3-http
    handler: ./functions/quality_check
    image: ${REGISTRY:-localhost:5000}/admission-quality-check:${TAG:-latest}
    environment: *env
    secrets: *auth_secrets
    labels:
      com.openfaas.scale.min: "0"
      com.openfaas.scale.max: "20"
      com.openfaas.scale.zero: "true"

  classify:
    lang: python3-http
    handler: ./functions/classify
    image: ${REGISTRY:-localhost:5000}/admission-classify:${TAG:-latest}
    build_args:
      ADDITIONAL_PACKAGE: tesseract-ocr tesseract-ocr-urd libgl1 libgomp1
    environment:
      <<: *env
      AP_OLLAMA_URL: http://ollama.admission:11434
      exec_timeout: 120s
      write_timeout: 120s
      read_timeout: 120s
    secrets: &secrets
      - database-url
      - s3-access-key
      - s3-secret-key
    labels:
      com.openfaas.scale.min: "0"
      com.openfaas.scale.max: "10"
      com.openfaas.scale.zero: "true"

  extract:
    lang: python3-http
    handler: ./functions/extract
    image: ${REGISTRY:-localhost:5000}/admission-extract:${TAG:-latest}
    build_args:
      ADDITIONAL_PACKAGE: tesseract-ocr tesseract-ocr-urd libgl1 libgomp1
    environment:
      <<: *env
      AP_OLLAMA_URL: http://ollama.admission:11434
      exec_timeout: 120s
      write_timeout: 120s
      read_timeout: 120s
    secrets: *secrets
    labels:
      com.openfaas.scale.min: "0"
      com.openfaas.scale.max: "10"
      com.openfaas.scale.zero: "true"

  validate:
    lang: python3-http
    handler: ./functions/validate
    image: ${REGISTRY:-localhost:5000}/admission-validate:${TAG:-latest}
    environment: *env
    secrets: *secrets
    labels:
      com.openfaas.scale.min: "0"
      com.openfaas.scale.max: "20"
      com.openfaas.scale.zero: "true"

  cross-check:
    lang: python3-http
    handler: ./functions/cross_check
    image: ${REGISTRY:-localhost:5000}/admission-cross-check:${TAG:-latest}
    environment: *env
    secrets: *secrets
    labels:
      com.openfaas.scale.min: "0"
      com.openfaas.scale.max: "10"
      com.openfaas.scale.zero: "true"

  decide:
    lang: python3-http
    handler: ./functions/decide
    image: ${REGISTRY:-localhost:5000}/admission-decide:${TAG:-latest}
    environment: *env
    secrets: *secrets
    labels:
      com.openfaas.scale.min: "0"
      com.openfaas.scale.max: "10"
      com.openfaas.scale.zero: "true"

  review-api:
    lang: dockerfile
    handler: ./functions/review_api
    image: ${REGISTRY:-localhost:5000}/admission-review-api:${TAG:-latest}
    environment:
      <<: *env
      PYTHONPATH: /home/app/function/libs:/home/app
    secrets:
      - database-url
      - s3-access-key
      - s3-secret-key
      - uni-a-staff-key
      - uni-b-staff-key
      - uni-c-staff-key
    labels:
      com.openfaas.scale.min: "1"
      com.openfaas.scale.max: "3"

  review-ui:
    lang: dockerfile
    handler: ./functions/review_ui
    image: ${REGISTRY:-localhost:5000}/admission-review-ui:${TAG:-latest}
    environment:
      AP_REVIEW_API_URL: http://gateway.openfaas:8080/function/review-api
    labels:
      com.openfaas.scale.min: "0"
      com.openfaas.scale.max: "2"
      com.openfaas.scale.zero: "true"

  feedback:
    lang: python3-http
    handler: ./functions/feedback
    image: ${REGISTRY:-localhost:5000}/admission-feedback:${TAG:-latest}
    environment:
      <<: *env
      AP_OLLAMA_URL: http://ollama.admission:11434
    secrets: *secrets
    labels:
      com.openfaas.scale.min: "0"
      com.openfaas.scale.max: "2"
      com.openfaas.scale.zero: "true"
