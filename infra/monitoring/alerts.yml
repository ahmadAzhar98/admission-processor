groups:
  - name: admission-pipeline
    rules:
      - alert: QueueBacklogGrowing
        expr: sum(jetstream_consumer_num_pending) > 500
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "More than 500 queued pipeline events for 10 minutes"
          description: "Replicas may be capped too low for the upload rate."

      - alert: FunctionErrorRateHigh
        expr: |
          sum by (function_name) (rate(gateway_function_invocation_total{code=~"5.."}[5m]))
            / sum by (function_name) (rate(gateway_function_invocation_total[5m])) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.function_name }} fails more than 5% of invocations"

      - alert: IntakeLatencyHigh
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(gateway_functions_seconds_bucket{function_name=~"intake.*"}[5m]))) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 intake latency above 2s; applicants are waiting on uploads"
