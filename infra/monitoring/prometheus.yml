# Scrapes the OpenFaaS gateway (invocations, latency, replicas) and the NATS
# exporter (JetStream queue depth). In-cluster, the OpenFaaS Helm chart's own
# Prometheus already scrapes the gateway; this file serves the compose stack
# and documents the metrics the dashboard relies on.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: openfaas-gateway
    static_configs:
      - targets: ["host.docker.internal:8080"]
    metrics_path: /metrics

  - job_name: nats
    static_configs:
      - targets: ["nats-exporter:7777"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
