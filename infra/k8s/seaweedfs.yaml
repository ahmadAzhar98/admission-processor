apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: seaweedfs
  namespace: admission
spec:
  serviceName: seaweedfs-s3
  replicas: 1
  selector:
    matchLabels: {app: seaweedfs}
  template:
    metadata:
      labels: {app: seaweedfs}
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:3.80
          args: ["server", "-s3", "-s3.config=/etc/seaweedfs/s3.json", "-dir=/data", "-ip.bind=0.0.0.0"]
          ports: [{containerPort: 8333}]
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: s3-config, mountPath: /etc/seaweedfs, readOnly: true}
      volumes:
        - name: s3-config
          secret: {secretName: seaweedfs-s3-config}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 100Gi}}
---
apiVersion: v1
kind: Service
metadata:
  name: seaweedfs-s3
  namespace: admission
spec:
  selector: {app: seaweedfs}
  ports: [{port: 8333}]
