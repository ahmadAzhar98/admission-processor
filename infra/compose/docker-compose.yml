# Local development dependencies. Functions run on the host (or in faasd)
# and reach these services on localhost. All credentials here are
# development defaults; never reuse them in a deployment.
name: admission

services:
  postgres:
    image: pgvector/pgvector:0.8.0-pg16
    environment:
      POSTGRES_USER: admission
      POSTGRES_PASSWORD: admission
      POSTGRES_DB: admission
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admission"]
      interval: 5s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data -ip.bind=0.0.0.0
    ports: ["8333:8333"]
    volumes:
      - seaweedfs-data:/data
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]

  ollama:
    image: ollama/ollama:0.5.7
    ports: ["11434:11434"]
    volumes: [ollama-models:/root/.ollama]
    profiles: [llm]

  nats-exporter:
    image: natsio/prometheus-nats-exporter:0.16.0
    command: ["-jsz=all", "-varz", "http://nats:8222"]
    profiles: [monitoring]

  prometheus:
    image: prom/prometheus:v3.1.0
    ports: ["9090:9090"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    profiles: [monitoring]

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3000:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../monitoring/grafana/provisioning/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../monitoring/grafana/provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    profiles: [monitoring]

volumes:
  postgres-data:
  seaweedfs-data:
  ollama-models:
