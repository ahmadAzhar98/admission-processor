[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "admission-processor"
version = "0.0.0"
description = "Multi-tenant, AI-assisted admission-document processing on OpenFaaS"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
dev = [
  "commitizen==4.19.3",
  "mypy==2.4.1",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["libs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF",
  "T20",  # no print: use logging
  "BLE",  # no blind except
  "D",    # docstrings on public API
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "libs"
explicit_package_bases = true
files = ["libs"]

[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
annotated_tag = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
bump_message = "chore: release v$new_version"

[tool.pytest.ini_options]
testpaths = ["libs"]
pythonpath = [".", "libs"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs running services (Postgres, object storage, OpenFaaS); excluded from make test",
]
