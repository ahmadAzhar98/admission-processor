[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "admission-processor"
version = "0.1.0"
description = "Multi-tenant, AI-assisted admission-document processing on OpenFaaS"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "boto3==1.43.123",
  "pydantic==2.14.2",
  "pydantic-settings==2.16.2",
]

[project.optional-dependencies]
dev = [
  "commitizen==4.19.3",
  "mypy==2.4.1",
  "pre-commit==4.7.0",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "ruff==0.17.3",
]

[tool.setuptools.packages.find]
where = ["libs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "N", "S", "SIM", "RUF",
  "T20",  # no print: use logging
  "BLE",  # no blind except
  "D",    # docstrings on public API
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D", "S101"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "libs"
explicit_package_bases = true
files = ["libs"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[tool.commitizen]
name = "cz_customize"
version_provider = "pep621"
tag_format = "v$version"
major_version_zero = true
annotated_tag = true
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
bump_message = "chore: release v$new_version"

# Same Conventional Commits rules as cz_conventional_commits, narrowed to the
# types and scopes allowed by CLAUDE.md, with a 72-char lowercase header, and
# with every type listed in the changelog rather than only feat/fix/perf.
[tool.commitizen.customize]
message_template = "{{change_type}}{% if scope %}({{scope}}){% endif %}: {{message}}"
example = "feat(extract): add cnic field parser"
schema = "<type>(<scope>): <summary>\n\n<body>\n\n<footer>"
schema_pattern = '(?s)(?=[^\n]{1,72}(?:\n|$))(build|chore|ci|docs|feat|fix|perf|refactor|revert|test)(\((intake|quality|classify|extract|validate|crosscheck|decide|notify|tenant|common|synthetic|infra|ui|docs|deps)\))?!?: [^A-Z\s][^\n\r]*((\n\n.*)|(\s*))?$'
commit_parser = '^(?P<change_type>build|chore|ci|docs|feat|fix|perf|refactor|revert|test)(?:\((?P<scope>[^()\r\n]*)\))?(?P<breaking>!)?:\s(?P<message>.*)?'
changelog_pattern = '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|test)(\(.+\))?!?:'
change_type_order = ["Features", "Bug Fixes", "Performance", "Refactoring", "Tests", "Documentation", "Build", "CI", "Chores", "Reverts"]

[tool.commitizen.customize.change_type_map]
feat = "Features"
fix = "Bug Fixes"
perf = "Performance"
refactor = "Refactoring"
test = "Tests"
docs = "Documentation"
build = "Build"
ci = "CI"
chore = "Chores"
revert = "Reverts"

[tool.pytest.ini_options]
testpaths = ["libs"]
pythonpath = [".", "libs"]
addopts = "-ra --strict-markers"
markers = [
  "integration: needs running services (Postgres, object storage, OpenFaaS); excluded from make test",
]
