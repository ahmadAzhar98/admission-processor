# Continuous delivery: runs only when a release tag (vX.Y.Z) is pushed.
# Tags are created by `cz bump` on a reviewed chore/release-* branch, so this
# workflow never commits or pushes to the repository; it verifies the tag,
# publishes one image per function to GHCR and creates the GitHub Release.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FAAS_CLI_VERSION: "0.18.17"

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.registry.outputs.registry }}
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: make setup PYTHON=python
      - name: Tag matches the bumped version
        id: version
        run: echo "version=$(.venv/bin/python -m infra.ci.release_tools check-version "$GITHUB_REF_NAME")" >> "$GITHUB_OUTPUT"
      - name: make check
        run: make check
      - name: Image registry
        id: registry
        run: echo "registry=$(.venv/bin/python -m infra.ci.release_tools registry "$GITHUB_REPOSITORY_OWNER")" >> "$GITHUB_OUTPUT"
      - name: Function matrix
        id: matrix
        run: echo "matrix=$(.venv/bin/python -m infra.ci.release_tools matrix)" >> "$GITHUB_OUTPUT"

  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        function: ${{ fromJSON(needs.verify.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Install faas-cli
        run: |
          curl -sSLf -o faas-cli "https://github.com/openfaas/faas-cli/releases/download/${FAAS_CLI_VERSION}/faas-cli"
          sudo install -m 0755 faas-cli /usr/local/bin/faas-cli
      - name: Pull function templates
        run: faas-cli template pull stack -f stack.yml
      - name: Build and push ${{ matrix.function.name }}
        env:
          REGISTRY: ${{ needs.verify.outputs.registry }}
          TAG: ${{ needs.verify.outputs.version }}
        run: faas-cli publish -f stack.yml --filter "${{ matrix.function.name }}" --platforms linux/amd64

  release:
    needs: [verify, images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Release notes from CHANGELOG.md
        run: |
          pip install "pyyaml==6.0.3"
          python -m infra.ci.release_tools notes "$GITHUB_REF_NAME" > release-notes.md
          {
            echo ""
            echo "### Images"
            echo ""
            echo "\`${{ needs.verify.outputs.registry }}/admission-<function>:${{ needs.verify.outputs.version }}\`"
          } >> release-notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md
